<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Ticket Support System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        h1, h2, h3, h4 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
        }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
        }
        
        .gradient-primary {
            background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-slideInUp {
            animation: slideInUp 0.6s ease-out forwards;
        }
        
        .form-group {
            position: relative;
        }
        
        .form-input {
            transition: all 0.3s ease;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(203, 213, 225, 0.2);
            color: white;
        }
        
        .form-input:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #06b6d4;
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
        }
        
        .form-input::placeholder {
            color: rgba(203, 213, 225, 0.6);
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(6, 182, 212, 0.4);
        }
        
        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .strength-meter {
            height: 4px;
            background: rgba(203, 213, 225, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }
        
        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
            border-radius: 2px;
        }
    </style>
</head>
<body class="flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">
        <!-- Logo & Header -->
        <div class="text-center mb-8 animate-slideInUp" style="animation-delay: 0s;">
            <div class="w-16 h-16 gradient-primary rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M2.5 3A1.5 1.5 0 001 4.5v.006c0 .836.772 1.5 1.5 1.5h15c.728 0 1.5-.664 1.5-1.5V4.5A1.5 1.5 0 0017.5 3h-15z"/>
                    <path fill-rule="evenodd" d="M2 7.5A1.5 1.5 0 013.5 6h13A1.5 1.5 0 0118 7.5v9A1.5 1.5 0 0116.5 18h-13A1.5 1.5 0 012 16.5v-9z"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Đăng Ký Tài Khoản</h1>
            <p class="text-slate-400">Tham gia hệ thống quản lý ticket hiện đại</p>
        </div>

        <!-- Registration Form -->
        <form id="register-form" class="space-y-4 animate-slideInUp" style="animation-delay: 0.1s;">
            <div class="form-group">
                <label class="block text-sm font-semibold text-slate-300 mb-2">Tên Đầy Đủ</label>
                <input type="text" id="fullname" placeholder="Nguyễn Văn A" 
                       class="form-input w-full px-4 py-3 rounded-lg focus:outline-none text-white"
                       required>
            </div>

            <div class="form-group">
                <label class="block text-sm font-semibold text-slate-300 mb-2">Tên Đăng Nhập (Username)</label>
                <input type="text" id="username" placeholder="nguyenvana" 
                       class="form-input w-full px-4 py-3 rounded-lg focus:outline-none text-white"
                       required pattern="[a-zA-Z0-9_]{3,}">
                <p class="text-xs text-slate-500 mt-1">Tối thiểu 3 ký tự, chỉ chứa chữ, số, dấu gạch dưới</p>
            </div>

            <div class="form-group">
                <label class="block text-sm font-semibold text-slate-300 mb-2">Email</label>
                <input type="email" id="email" placeholder="nguyen@example.com" 
                       class="form-input w-full px-4 py-3 rounded-lg focus:outline-none text-white"
                       required>
            </div>

            <div class="form-group">
                <label class="block text-sm font-semibold text-slate-300 mb-2">Mật Khẩu</label>
                <input type="password" id="password" placeholder="••••••••" 
                       class="form-input w-full px-4 py-3 rounded-lg focus:outline-none text-white"
                       required minlength="6">
                <div class="strength-meter">
                    <div id="strength-bar" class="strength-bar bg-red-500"></div>
                </div>
                <p id="strength-text" class="text-xs text-red-400 mt-1">Mật khẩu yếu</p>
            </div>

            <div class="form-group">
                <label class="block text-sm font-semibold text-slate-300 mb-2">Xác Nhận Mật Khẩu</label>
                <input type="password" id="confirm-password" placeholder="••••••••" 
                       class="form-input w-full px-4 py-3 rounded-lg focus:outline-none text-white"
                       required minlength="6">
            </div>

            <div class="form-group">
                <label class="flex items-center gap-3 text-sm text-slate-300 cursor-pointer">
                    <input type="checkbox" id="terms" class="w-5 h-5 rounded cursor-pointer" required>
                    <span>Tôi đồng ý với <a href="#" class="text-cyan-400 hover:underline">Điều khoản sử dụng</a> và <a href="#" class="text-cyan-400 hover:underline">Chính sách bảo mật</a></span>
                </label>
            </div>

            <button type="submit" id="btn-register"
                    class="btn-submit w-full text-white font-bold py-3 rounded-lg transition disabled:opacity-50">
                Đăng Ký
            </button>
        </form>

        <!-- Login Link -->
        <div class="mt-6 text-center text-slate-400 animate-slideInUp" style="animation-delay: 0.2s;">
            Đã có tài khoản?
            <a href="login.html" class="text-cyan-400 font-semibold hover:text-cyan-300 transition">Đăng nhập ngay</a>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:5050/api';
        const form = document.getElementById('register-form');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const strengthBar = document.getElementById('strength-bar');
        const strengthText = document.getElementById('strength-text');
        const registerBtn = document.getElementById('btn-register');

        // Password strength checker
        function checkPasswordStrength(password) {
            let strength = 0;
            const patterns = {
                length: password.length >= 8,
                lowercase: /[a-z]/.test(password),
                uppercase: /[A-Z]/.test(password),
                number: /\d/.test(password),
                special: /[!@#$%^&*]/.test(password)
            };

            Object.values(patterns).forEach(match => {
                if (match) strength++;
            });

            const strengthLevels = [
                { width: 0, text: 'Quá yếu', color: 'bg-red-500' },
                { width: 20, text: 'Yếu', color: 'bg-orange-500' },
                { width: 40, text: 'Trung bình', color: 'bg-yellow-500' },
                { width: 60, text: 'Khá', color: 'bg-blue-500' },
                { width: 80, text: 'Mạnh', color: 'bg-emerald-500' }
            ];

            const level = strengthLevels[strength] || strengthLevels[0];
            strengthBar.style.width = level.width + '%';
            strengthBar.className = `strength-bar ${level.color}`;
            strengthText.textContent = level.text;
            strengthText.className = `text-xs ${level.color.replace('bg-', 'text-')} mt-1`;
        }

        passwordInput.addEventListener('input', (e) => checkPasswordStrength(e.target.value));

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullname = document.getElementById('fullname').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const termsAccepted = document.getElementById('terms').checked;

            // Validation
            if (!termsAccepted) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Chưa Đồng Ý',
                    text: 'Vui lòng chấp nhận điều khoản sử dụng',
                    confirmButtonColor: '#06b6d4'
                });
                return;
            }

            if (password !== confirmPassword) {
                Swal.fire({
                    icon: 'error',
                    title: 'Mật Khẩu Không Khớp',
                    text: 'Vui lòng nhập mật khẩu xác nhận giống nhau',
                    confirmButtonColor: '#06b6d4'
                });
                confirmPasswordInput.focus();
                return;
            }

            if (password.length < 6) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Mật Khẩu Yếu',
                    text: 'Mật khẩu phải tối thiểu 6 ký tự',
                    confirmButtonColor: '#06b6d4'
                });
                return;
            }

            registerBtn.disabled = true;
            registerBtn.innerText = 'Đang xử lý...';

            try {
                const response = await fetch(`${BASE_URL}/Auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fullname,
                        username,
                        email,
                        password
                    })
                });

                if (response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Đăng Ký Thành Công!',
                        text: 'Tài khoản của bạn đã được tạo. Vui lòng đăng nhập.',
                        confirmButtonColor: '#06b6d4'
                    }).then(() => {
                        window.location.href = 'login.html';
                    });
                } else {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.message || 'Đăng ký thất bại. Vui lòng thử lại.');
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Lỗi Đăng Ký',
                    text: error.message,
                    confirmButtonColor: '#06b6d4'
                });
                registerBtn.disabled = false;
                registerBtn.innerText = 'Đăng Ký';
            }
        });
    </script>
</body>
</html>
