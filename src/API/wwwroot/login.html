<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Ticket Support System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        h1, h2, h3, h4 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
        }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
        }
        
        .gradient-primary {
            background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-slideInUp {
            animation: slideInUp 0.6s ease-out forwards;
        }
        
        .form-input {
            transition: all 0.3s ease;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(203, 213, 225, 0.2);
            color: white;
        }
        
        .form-input:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #06b6d4;
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
        }
        
        .form-input::placeholder {
            color: rgba(203, 213, 225, 0.6);
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(6, 182, 212, 0.4);
        }
        
        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .demo-accounts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        
        .demo-btn {
            padding: 12px;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 8px;
            color: #06b6d4;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
            font-weight: 600;
        }
        
        .demo-btn:hover {
            background: rgba(6, 182, 212, 0.2);
            border-color: #06b6d4;
        }
    </style>
</head>
<body class="flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">
        <!-- Logo & Header -->
        <div class="text-center mb-8 animate-slideInUp" style="animation-delay: 0s;">
            <div class="w-16 h-16 gradient-primary rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M2.5 3A1.5 1.5 0 001 4.5v.006c0 .836.772 1.5 1.5 1.5h15c.728 0 1.5-.664 1.5-1.5V4.5A1.5 1.5 0 0017.5 3h-15z"/>
                    <path fill-rule="evenodd" d="M2 7.5A1.5 1.5 0 013.5 6h13A1.5 1.5 0 0118 7.5v9A1.5 1.5 0 0116.5 18h-13A1.5 1.5 0 012 16.5v-9z"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Đăng Nhập</h1>
            <p class="text-slate-400">Truy cập vào hệ thống quản lý ticket</p>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4 animate-slideInUp" style="animation-delay: 0.1s;">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Tên Tài Khoản (Username)</label>
                <input type="text" id="username" placeholder="Nhập username..." 
                       class="form-input w-full px-4 py-3 rounded-lg focus:outline-none text-white"
                       required>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Mật Khẩu</label>
                <input type="password" id="password" placeholder="••••••••" 
                       class="form-input w-full px-4 py-3 rounded-lg focus:outline-none text-white"
                       required>
            </div>

            <div class="flex items-center justify-between">
                <label class="flex items-center gap-2 text-sm text-slate-400 cursor-pointer">
                    <input type="checkbox" id="remember" class="w-4 h-4 rounded">
                    Nhớ tôi
                </label>
                <a href="#" class="text-sm text-cyan-400 hover:text-cyan-300">Quên mật khẩu?</a>
            </div>

            <button type="submit" id="btn-login"
                    class="btn-submit w-full text-white font-bold py-3 rounded-lg transition disabled:opacity-50">
                Đăng Nhập
            </button>
        </form>

        <!-- Demo Accounts -->
        <div class="mt-6 animate-slideInUp" style="animation-delay: 0.15s;">
            <p class="text-xs text-slate-400 text-center mb-3 uppercase font-semibold">Tài khoản Demo (Test)</p>
            <div class="demo-accounts">
                <button type="button" class="demo-btn" onclick="demoLogin('admin', 'password')">
                    👨‍💼 Admin
                </button>
                <button type="button" class="demo-btn" onclick="demoLogin('staff', 'password')">
                    👨‍🔧 Staff
                </button>
                <button type="button" class="demo-btn" onclick="demoLogin('customer', 'password')">
                    👤 Customer
                </button>
            </div>
        </div>

        <!-- Register Link -->
        <div class="mt-6 text-center text-slate-400 animate-slideInUp" style="animation-delay: 0.2s;">
            Chưa có tài khoản?
            <a href="register.html" class="text-cyan-400 font-semibold hover:text-cyan-300 transition">Đăng ký ngay</a>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:5050/api';
        const form = document.getElementById('login-form');
        const loginBtn = document.getElementById('btn-login');

        async function performLogin(username, password) {
            loginBtn.disabled = true;
            loginBtn.innerText = 'Đang xử lý...';

            try {
                // 1. Login
                const loginResponse = await fetch(`${BASE_URL}/Auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!loginResponse.ok) {
                    const errData = await loginResponse.json().catch(() => ({}));
                    throw new Error(errData.message || 'Tài khoản hoặc mật khẩu không chính xác.');
                }

                const authData = await loginResponse.json();
                
                localStorage.setItem('accessToken', authData.token);
                localStorage.setItem('username', authData.username);

                // 2. Get user info
                const userResponse = await fetch(`${BASE_URL}/Users/me`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authData.token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!userResponse.ok) {
                    throw new Error('Không thể đồng bộ thông tin quyền hạn tài khoản.');
                }

                const userData = await userResponse.json();
                const userRole = userData.role;

                // 3. Redirect based on role
                if (userRole === 'Admin') {
                    window.location.href = 'admin.html';
                } else if (userRole === 'IT_Support' || userRole === 'Staff') {
                    window.location.href = 'staff.html';
                } else {
                    window.location.href = 'customer.html';
                }

            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Lỗi Đăng Nhập',
                    text: error.message,
                    confirmButtonColor: '#06b6d4'
                });
                loginBtn.disabled = false;
                loginBtn.innerText = 'Đăng Nhập';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Chưa Đầy Đủ',
                    text: 'Vui lòng nhập tên tài khoản và mật khẩu',
                    confirmButtonColor: '#06b6d4'
                });
                return;
            }

            await performLogin(username, password);
        });

        function demoLogin(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
            performLogin(username, password);
        }
    </script>
</body>
</html>
